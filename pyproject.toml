[project]
name = "hentai-telegram"
version = "1.0.0"
description = "Hentai-Telegram: Telegram Manga to Telegraph Channel Uploader Bot"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiogram>=3.13,<4",
  "Pillow>=10,<13",
  "jmcomic>=2.5,<3",
  "requests>=2.32,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hentai-telegram = "hentai_telegram.main:main"
hentai_telegram = "hentai_telegram.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
