services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app-data/hentai_telegram.db
      STORAGE_ROOT: /storage
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    volumes:
      - ./data/app:/app-data
      - ./data/storage:/storage
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, hentai_telegram.main, health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
